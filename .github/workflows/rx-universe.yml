name: Build, verify and publish RX Universe
on:
  push:
    branches: [main]
    paths: ['apps/rx-universe/**', '.github/workflows/rx-universe.yml', 'index.html']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/rx-universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify temporal model, source provenance and SQLite integrity
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify desktop, mobile and temporal behavior
        run: npm run test:browser
      - name: Record verified release identity
        run: |
          python3 - <<'PYRELEASE'
          import json, os
          from pathlib import Path
          Path('dist/release.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'version': '2.3.0', 'validation_run': os.environ['GITHUB_RUN_ID']}))
          PYRELEASE
      - name: Preserve existing homepage and prepare RX path
        run: |
          mkdir -p ../../_site/rx-universe
          cp ../../index.html ../../_site/index.html
          cp -R dist/. ../../_site/rx-universe/
          touch ../../_site/.nojekyll
      - name: Store browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rx-browser-evidence
          path: apps/rx-universe/test-results
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}rx-universe/
    steps:
      - uses: actions/checkout@v4
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify anonymous public access
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}rx-universe/
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --max-time 20 "$SITE_URL" -o /tmp/rx-page.html && grep -q 'SAMSUNG RX' /tmp/rx-page.html; then
              echo "Public website verified: $SITE_URL"
              break
            fi
            sleep 10
          done
          curl --fail --location --retry 4 --retry-delay 5 --max-time 30 "${SITE_URL}data/rx-research.json" -o /tmp/rx-research.json
          curl --fail --location --retry 4 --retry-delay 5 --max-time 30 "${SITE_URL}data/rx-research.sqlite" -o /tmp/rx-research.sqlite
          curl --fail --location --retry 4 --retry-delay 5 --max-time 30 "${SITE_URL}release.json" -o /tmp/rx-release.json
          python3 - <<'PYCODE'
          import json, sqlite3, os
          from pathlib import Path
          expected = json.loads(Path('apps/rx-universe/src/research-data.json').read_text())
          actual = json.loads(Path('/tmp/rx-research.json').read_text())
          assert json.loads(Path('/tmp/rx-release.json').read_text())['commit'] == os.environ['GITHUB_SHA'], 'Public release does not match this commit'
          assert actual == expected, 'Published research JSON differs from this commit'
          db = sqlite3.connect('/tmp/rx-research.sqlite')
          assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert db.execute('SELECT COUNT(*) FROM Sources').fetchone()[0] == len(expected['records'])
          assert db.execute('PRAGMA foreign_key_check').fetchall() == []
          assert db.execute('SELECT COUNT(*) FROM Claims').fetchone()[0] == sum(len(row.get('claims', [row['claim']])) for row in expected['records'])
          assert 'SAMSUNG RX' in Path('/tmp/rx-page.html').read_text()
          print('Anonymous public JSON and SQLite verified:', len(expected['records']), 'sources')
          PYCODE
